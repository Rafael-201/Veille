name: probe
on:
  push:
    branches: [probe-sources]
    paths-ignore: [probe.txt]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install -q feedparser
          python probe.py > probe.txt 2>&1 || true
          git config user.name probe-bot; git config user.email probe-bot@users.noreply.github.com
          git add probe.txt; git commit -m "probe results"; git push
